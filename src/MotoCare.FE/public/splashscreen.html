<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MotoCare</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      body {
        display: grid;
        place-items: center;
        padding: 14px;
      }

      .splash {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 34px 38px 30px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 26px;
        background:
          radial-gradient(circle at 85% 10%, rgba(245, 158, 11, 0.26), transparent 34%),
          linear-gradient(145deg, #102a43 0%, #0b1f33 58%, #071623 100%);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .mark {
        display: grid;
        width: 58px;
        height: 58px;
        place-items: center;
        border-radius: 18px;
        color: #102a43;
        font-size: 25px;
        font-weight: 900;
        background: linear-gradient(135deg, #fbbf24, #f59e0b);
        box-shadow: 0 12px 28px rgba(245, 158, 11, 0.25);
      }

      h1 {
        margin: 0;
        color: #f8fafc;
        font-size: 30px;
        letter-spacing: -0.8px;
      }

      .tagline {
        margin: 4px 0 0;
        color: #9fb3c8;
        font-size: 13px;
      }

      .status {
        display: grid;
        gap: 13px;
      }

      #message {
        min-height: 20px;
        margin: 0;
        color: #d9e2ec;
        font-size: 14px;
      }

      .track {
        width: 100%;
        height: 5px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.09);
      }

      #bar {
        width: 35%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #f59e0b, #fcd34d);
        box-shadow: 0 0 18px rgba(245, 158, 11, 0.55);
        transition: width 220ms ease;
        animation: loading 1.3s ease-in-out infinite;
      }

      #bar.determinate {
        animation: none;
      }

      @keyframes loading {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(330%); }
      }
    </style>
  </head>
  <body>
    <main class="splash">
      <div class="brand">
        <div class="mark">M</div>
        <div>
          <h1>MotoCare</h1>
          <p class="tagline">Garage management, made simple.</p>
        </div>
      </div>

      <section class="status" aria-live="polite">
        <p id="message">Đang khởi động ứng dụng...</p>
        <div class="track" role="progressbar" aria-label="Tiến trình khởi động">
          <div id="bar"></div>
        </div>
      </section>
    </main>

    <script>
      window.setSplashStatus = ({ message, progress }) => {
        const messageElement = document.getElementById('message')
        const barElement = document.getElementById('bar')
        messageElement.textContent = message

        if (typeof progress === 'number') {
          barElement.classList.add('determinate')
          barElement.style.width = `${Math.max(0, Math.min(100, progress))}%`
        } else {
          barElement.classList.remove('determinate')
          barElement.style.width = '35%'
        }
      }
    </script>
  </body>
</html>
