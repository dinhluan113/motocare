server {
    listen 80;
    listen [::]:80;
    server_name moto.luandinh.com;

    access_log /var/log/nginx/motocare.access.log;
    error_log /var/log/nginx/motocare.error.log;
    client_max_body_size 10m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /releases/ {
        alias /home/MotoCare/windows-releases/;
        autoindex off;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        types {
            application/json json;
            application/octet-stream exe sig;
        }
        limit_except GET HEAD { deny all; }
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:5112/health;
        proxy_http_version 1.1;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5112;
        proxy_http_version 1.1;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
    }

    location /hubs/ {
        proxy_pass http://127.0.0.1:5112;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/proxy_params;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5112;
        proxy_http_version 1.1;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:5113;
        proxy_http_version 1.1;
        include /etc/nginx/proxy_params;
    }
}
